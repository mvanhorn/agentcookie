name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Build Linux binaries on Ubuntu using .goreleaser.linux.yaml
  build-linux:
    runs-on: ubuntu-latest
    if: ${{ vars.RELEASE_CI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Install cross-compiler for arm64
      - name: install arm64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Use goreleaser with the linux-specific config
      - name: goreleaser linux
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config .goreleaser.linux.yaml --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: upload linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/*.tar.gz

  # Build darwin binaries on macOS (codesigning requires macOS). It runs
  # after build-linux because the darwin binary embeds the SHA256 of the
  # Linux tarballs that publish uploads (the teammate pairing notice pins
  # them); see docs/releasing.md.
  build-darwin:
    runs-on: macos-latest
    needs: [build-linux]
    if: ${{ vars.RELEASE_CI_ENABLED == 'true' }}
    # Step-level `if:` cannot read the secrets context (GitHub rejects the
    # whole workflow file), so expose whether each secret is set here.
    env:
      HAS_SIGNING_CERT: ${{ secrets.CERTIFICATE_OSX_APPLICATION != '' }}
      HAS_NOTARY_PASSWORD: ${{ secrets.AC_NOTARY_PASSWORD != '' }}
      HAS_NOTARY_API_KEY: ${{ secrets.AC_API_KEY_P8 != '' && secrets.AC_API_KEY_ID != '' && secrets.AC_API_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: import Developer ID cert
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          p12-password: ${{ secrets.CERTIFICATE_OSX_APPLICATION_PASSWORD }}

      - name: list codesigning identities
        run: security find-identity -v -p codesigning

      # Preferred: an App Store Connect API key (no Apple Account password,
      # no 2FA, no app-specific password to rotate). Same profile name, so
      # scripts/notarize.sh is unchanged.
      - name: setup notarytool credentials (App Store Connect API key)
        if: ${{ env.HAS_NOTARY_API_KEY == 'true' }}
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_${AC_API_KEY_ID}.p8"
          printf '%s' "$AC_API_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          xcrun notarytool store-credentials agentcookie-notary \
            --key "$key" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID"
          rm -f "$key"

      # Fallback: Apple ID + app-specific password, only when no API key is set.
      - name: setup notarytool credentials (Apple ID)
        if: ${{ env.HAS_NOTARY_API_KEY != 'true' && env.HAS_NOTARY_PASSWORD == 'true' }}
        env:
          AC_NOTARY_PASSWORD: ${{ secrets.AC_NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials agentcookie-notary \
            --apple-id mvanhorn@gmail.com \
            --team-id NM8VT393AR \
            --password "$AC_NOTARY_PASSWORD"

      # The exact Linux tarballs publish will upload, so their digests can
      # be embedded in the darwin build below.
      - name: download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist/

      # Build, sign, and notarize a Universal 2 (arm64 + x86_64) binary
      # with the Linux tarball digests embedded. After this step
      # bin/agentcookie runs natively on Intel and Apple Silicon Macs
      # without Gatekeeper interactive approval.
      - name: make release-pinned
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make release-pinned TAG="$RELEASE_TAG"

      - name: build release tarball
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/release-tarball.sh "$RELEASE_TAG"

      # Fail before upload when the tarball was named for a single arch
      # (or never produced). upload-artifact's default if-no-files-found
      # is warn, which is how a darwin-less release can still be published.
      - name: require universal darwin tarball
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*darwin*universal*.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "error: no universal darwin tarball in dist/ (expected dist/*darwin*universal*.tar.gz)." >&2
            echo "make release and scripts/release-tarball.sh must produce a Universal 2 bundle before upload." >&2
            echo "refusing to continue; a missing file here is how macOS users get a linux-only release." >&2
            ls -la dist >&2 || true
            exit 1
          fi
          printf 'universal darwin tarball:\n'
          printf '  %s\n' "${files[@]}"

      - name: upload darwin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries
          path: dist/*darwin*universal*.tar.gz
          if-no-files-found: error

  # Publish release after both builds complete
  # A tag like v1.6.1-ci1 builds, signs and notarizes but never publishes,
  # so release CI can be proven without cutting a release.
  publish:
    runs-on: ubuntu-latest
    needs: [build-linux, build-darwin]
    if: ${{ vars.RELEASE_CI_ENABLED == 'true' && !contains(github.ref, '-ci') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist/

      - name: download darwin artifacts
        uses: actions/download-artifact@v4
        with:
          name: darwin-binaries
          path: dist/

      - name: list artifacts
        run: ls -la dist/

      - name: require universal darwin tarball before publish
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*darwin*universal*.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            printf 'error: refusing to publish %s without a universal darwin tarball.\n' "$RELEASE_TAG" >&2
            echo "dist/ has no *darwin*universal*.tar.gz asset, so a macOS installer would have nothing to download." >&2
            ls -la dist >&2 || true
            exit 1
          fi

      # Generate checksums for all archives
      - name: generate checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz > checksums.txt
          cat checksums.txt

      # Create the GitHub release with all assets
      - name: create release
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz \
            dist/checksums.txt \
            --title "agentcookie ${RELEASE_TAG}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
